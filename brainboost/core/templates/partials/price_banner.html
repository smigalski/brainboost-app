{% load i18n %}
<div id="bb-price-banner" class="bb-price-banner" role="region" aria-label="{% trans 'Preishinweis' %}" hidden>
    <div class="bb-price-banner__inner">
        <div class="bb-price-banner__text">
            <span class="bb-price-banner__headline">{% trans "Einzelunterricht ab 19€ / 45 Min – inkl. Lernfortschrittreport + kostenloser 5h-Online-Stornierung!" %}</span>
            <a class="bb-price-banner__link" href="{% url 'pricing' %}">{% trans "Preise ansehen" %}</a>
        </div>
        <button type="button" id="bb-price-banner-close" class="bb-price-banner__close" aria-label="{% trans 'Preishinweis schließen' %}">✕</button>
    </div>
</div>
