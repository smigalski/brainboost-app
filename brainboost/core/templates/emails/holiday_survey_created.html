{% extends "emails/base.html" %}

  <ul style="margin:0 0 12px 16px;padding:0;">
    <li><strong>SchülerIn:</strong> {{ student.user.display_name }}</li>
    <li><strong>TutorIn:</strong> {{ tutor.user.display_name }}</li>

    Bitte antworte schnellstmöglich hier:

{% endblock %}
