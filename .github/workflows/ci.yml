name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brainboost_local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brainboost_local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEV_SECRET_KEY: ci-dev-secret-key
      POSTGRES_LOCAL_DB: brainboost_local
      POSTGRES_LOCAL_USER: postgres
      POSTGRES_LOCAL_PASSWORD: postgres
      POSTGRES_LOCAL_HOST: 127.0.0.1
      POSTGRES_LOCAL_PORT: "5432"
      POSTGRES_LOCAL_TEST_DB: brainboost_local_test
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      APP_BASE_URL: http://localhost:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz-subset0 \
            libjpeg-dev \
            libopenjp2-7

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django checks
        run: python brainboost/manage.py check

      - name: Run tests
        run: python brainboost/manage.py test core
